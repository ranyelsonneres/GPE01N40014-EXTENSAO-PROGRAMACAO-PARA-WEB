<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de Funções</title>
</head>
<body>
    <h1>Calculadora de Abastecimento</h1>
    <hr>
    <p>Escolha o tipo de combustível:</p>
    <p>Tabela de preço:</p>
    <ul>
        <li>Gasolina: R$ 6.69</li>
        <li>Etanol: R$ 5.80</li>
        <li>Diesel: R$ 6.30</li>
    </ul>

    <form>
        <label for="combustivel">Tipo de Combustível</label>
        <select name="combustivel" id="combustivel">
            <option value="">Escolha uma opção:</option>
            <option value="gasolina">Gasolina</option>
            <option value="etanol">Etanol</option>
            <option value="diesel">Diesel</option>
        </select>
        <label for="litros">Quantidade (litros):</label>
        <input type="number" id="litros" min="0" step="0.1">
        <button id="btnCalcular">Calcular</button>
    </form>
    <h2>Resultado:</h2>
    <p id="resultado"></p>
    <script src="script.js"></script>    
</body>
</html>
